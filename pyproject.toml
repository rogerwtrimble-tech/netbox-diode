[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-recon"
version = "0.1.0"
description = "Inventory reconciliation for NetBox via Diode: plan, apply, verify, report."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "netboxlabs-diode-sdk==1.14.2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "tox>=4"]

[project.scripts]
recon = "inventory_recon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "D"]
ignore = ["D203", "D213", "D105", "D107", "D401", "PLR0913", "PLR2004", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D", "PLR2004"]
"scripts/*" = ["D", "S603", "S607", "PLW2901"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inventory_recon"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["netboxlabs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --cov=inventory_recon --cov-report=term-missing --cov-fail-under=85"
