# NetBox + Diode inventory reconciliation stack (MVP).
#
#   make init   -> generates .env + OAuth2 client credentials
#   make up     -> builds and starts everything, waits until healthy
#   make demo   -> runs the reconciliation scenario and writes reports/
#
# All images are pinned. Only NetBox (UI/API) and the Diode gRPC ingress are
# published to the host; every other service is internal to the compose network.

x-netbox: &netbox
  build:
    context: ./netbox
    secrets: [extra_ca]
  image: netbox-diode/netbox:4.7.2-diode-1.18.0
  restart: unless-stopped
  environment: &netbox-env
    DB_HOST: netbox-postgres
    DB_NAME: netbox
    DB_USER: netbox
    DB_PASSWORD: ${NETBOX_DB_PASSWORD}
    REDIS_HOST: netbox-redis
    REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
    REDIS_CACHE_HOST: netbox-redis-cache
    REDIS_CACHE_PASSWORD: ${NETBOX_REDIS_CACHE_PASSWORD}
    SECRET_KEY: ${NETBOX_SECRET_KEY}
    API_TOKEN_PEPPER_1: ${NETBOX_API_TOKEN_PEPPER}
    SUPERUSER_NAME: ${NETBOX_SUPERUSER_NAME}
    SUPERUSER_EMAIL: ${NETBOX_SUPERUSER_EMAIL}
    SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD}
    SUPERUSER_API_KEY: ${NETBOX_API_KEY}
    SUPERUSER_API_TOKEN: ${NETBOX_API_TOKEN}
    DIODE_TARGET: grpc://diode-nginx:80/diode
    DIODE_TARGET_DISPLAY: grpc://localhost:${DIODE_PORT}/diode
    GRANIAN_WORKERS: "2"
  volumes:
    - ./secrets/netbox/netbox_to_diode:/run/secrets/netbox_to_diode:ro
    - netbox-media:/opt/netbox/netbox/media
  depends_on:
    netbox-postgres:
      condition: service_healthy
    netbox-redis:
      condition: service_healthy
    netbox-redis-cache:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- NetBox
  netbox:
    <<: *netbox
    ports:
      - "${NETBOX_PORT}:8080"
    healthcheck:
      test: ["CMD", "/opt/netbox/health.sh"]
      start_period: 300s
      interval: 10s
      timeout: 5s
      retries: 5

  netbox-worker:
    <<: *netbox
    command: ["/opt/netbox/venv/bin/python", "/opt/netbox/netbox/manage.py", "rqworker"]
    depends_on:
      netbox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -aux | grep -v grep | grep -q rqworker"]
      interval: 15s
      timeout: 3s
      retries: 3

  netbox-postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${NETBOX_DB_PASSWORD}
    volumes:
      - netbox-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U netbox -d netbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  netbox-redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
    volumes:
      - netbox-redis-data:/data
    healthcheck: &redis-health
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  netbox-redis-cache:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${NETBOX_REDIS_CACHE_PASSWORD}
    healthcheck: *redis-health

  # ----------------------------------------------------------------- Diode
  diode-nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - "${DIODE_PORT}:80"
    volumes:
      - ./diode/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - diode-auth
      - diode-ingester
      - diode-reconciler

  diode-ingester:
    image: netboxlabs/diode-ingester:2.3.1
    restart: unless-stopped
    environment:
      REDIS_HOST: diode-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${DIODE_REDIS_PASSWORD}
      LOGGING_LEVEL: ${DIODE_LOGGING_LEVEL}
      TELEMETRY_METRICS_EXPORTER: prometheus
      TELEMETRY_TRACES_EXPORTER: none
      TELEMETRY_ENVIRONMENT: mvp
    depends_on:
      diode-redis:
        condition: service_healthy
      diode-reconciler:
        condition: service_started

  diode-reconciler:
    image: netboxlabs/diode-reconciler:2.3.1
    restart: unless-stopped
    environment:
      REDIS_HOST: diode-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${DIODE_REDIS_PASSWORD}
      LOGGING_LEVEL: ${DIODE_LOGGING_LEVEL}
      MIGRATION_ENABLED: "true"
      AUTO_APPLY_CHANGESETS: "true"
      POSTGRES_HOST: diode-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB_NAME: diode
      POSTGRES_USER: diode
      POSTGRES_PASSWORD: ${DIODE_POSTGRES_PASSWORD}
      NETBOX_DIODE_PLUGIN_API_BASE_URL: http://netbox:8080/api/plugins/diode
      NETBOX_DIODE_PLUGIN_API_TIMEOUT_SECONDS: "60"
      NETBOX_DIODE_PLUGIN_SKIP_TLS_VERIFY: "false"
      DIODE_AUTH_TOKEN_URL: http://diode-auth:8080/token
      DIODE_TO_NETBOX_CLIENT_ID: diode-to-netbox
      DIODE_TO_NETBOX_CLIENT_SECRET: ${DIODE_TO_NETBOX_CLIENT_SECRET}
      TELEMETRY_METRICS_EXPORTER: prometheus
      TELEMETRY_TRACES_EXPORTER: none
      TELEMETRY_ENVIRONMENT: mvp
    volumes:
      - ./secrets/oauth2:/etc/config/oauth2/client:ro
    depends_on:
      diode-redis:
        condition: service_healthy
      diode-postgres:
        condition: service_healthy
      netbox:
        condition: service_healthy

  diode-auth:
    image: netboxlabs/diode-auth:2.3.1
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      OAUTH2_PUBLIC_SERVER_URL: http://diode-hydra:4444
      OAUTH2_ADMIN_SERVER_URL: http://diode-hydra:4445
      TELEMETRY_METRICS_EXPORTER: prometheus
      TELEMETRY_TRACES_EXPORTER: none
      TELEMETRY_ENVIRONMENT: mvp
    depends_on:
      diode-auth-bootstrap:
        condition: service_completed_successfully

  diode-auth-bootstrap:
    image: netboxlabs/diode-auth:2.3.1
    command: ["/bin/sh", "/etc/config/oauth2/bootstrap-clients.sh"]
    environment:
      HYDRA_ADMIN_URL: http://diode-hydra:4445
    volumes:
      - ./secrets/oauth2:/etc/config/oauth2/client:ro
    restart: on-failure
    depends_on:
      diode-hydra:
        condition: service_healthy

  diode-hydra:
    image: oryd/hydra:v26.2.0
    restart: unless-stopped
    command: ["serve", "all", "--dev"]
    environment: &hydra-env
      DSN: postgres://hydra:${HYDRA_POSTGRES_PASSWORD}@diode-postgres:5432/hydra?sslmode=disable&max_conns=20&max_idle_conns=4
      URLS_SELF_ISSUER: http://127.0.0.1:4444
      SECRETS_SYSTEM: ${HYDRA_SECRETS_SYSTEM}
      STRATEGIES_ACCESS_TOKEN: jwt
      STRATEGIES_REFRESH_TOKEN: jwt
      STRATEGIES_JWT_SCOPE_CLAIM: both
      TTL_ACCESS_TOKEN: 1h
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:4444/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      diode-hydra-migrate:
        condition: service_completed_successfully

  diode-hydra-migrate:
    image: oryd/hydra:v26.2.0
    command: ["migrate", "sql", "up", "-e", "--yes"]
    environment: *hydra-env
    restart: on-failure
    depends_on:
      diode-postgres:
        condition: service_healthy

  diode-redis:
    image: redis/redis-stack-server:7.4.0-v8
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --dir /data --save 60 1 --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${DIODE_REDIS_PASSWORD}
    volumes:
      - diode-redis-data:/data
    healthcheck: *redis-health

  diode-postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DIODE_POSTGRES_ROOT_PASSWORD}
      DIODE_POSTGRES_PASSWORD: ${DIODE_POSTGRES_PASSWORD}
      HYDRA_POSTGRES_PASSWORD: ${HYDRA_POSTGRES_PASSWORD}
    volumes:
      - diode-postgres-data:/var/lib/postgresql/data
      - ./diode/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      # Healthy only once the init script has created the diode database.
      test: ["CMD-SHELL", "pg_isready -q -U diode -d diode"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------- Reconciliation tooling
  recon:
    build:
      context: .
      secrets: [extra_ca]
    image: netbox-diode/inventory-recon:0.1.0
    profiles: ["tools"]
    environment:
      RECON_NETBOX_URL: http://netbox:8080
      RECON_NETBOX_TOKEN: nbt_${NETBOX_API_KEY}.${NETBOX_API_TOKEN}
      RECON_DIODE_TARGET: grpc://diode-nginx:80/diode
      RECON_DIODE_CLIENT_ID: diode-ingest
      RECON_DIODE_CLIENT_SECRET: ${DIODE_INGEST_CLIENT_SECRET}
      RECON_DATA_DIR: /app/data
      RECON_REPORTS_DIR: /app/reports
    volumes:
      - ./data:/app/data:ro
      - ./reports:/app/reports
    depends_on:
      netbox:
        condition: service_healthy
      diode-nginx:
        condition: service_started

secrets:
  # Optional CA bundle for TLS-inspecting proxies during image builds.
  extra_ca:
    file: ${EXTRA_CA_BUNDLE:-./.empty-ca.pem}

volumes:
  netbox-media:
  netbox-postgres-data:
  netbox-redis-data:
  diode-redis-data:
  diode-postgres-data:
