name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "tox>=4"
      - run: tox -p

  e2e:
    name: end-to-end (compose stack + demo)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: make up
      - name: Run reconciliation demo
        run: make demo
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciliation-reports
          path: reports/
