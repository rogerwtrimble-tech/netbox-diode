[tox]
envlist = lint, type, py313
skip_missing_interpreters = true

[testenv]
extras = dev
commands = pytest {posargs}

[testenv:lint]
skip_install = true
deps = ruff>=0.8
commands =
    ruff check src tests scripts
    ruff format --check src tests scripts

[testenv:type]
extras = dev
commands = mypy
